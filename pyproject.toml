[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-ladder"
version = "0.2.0"
description = "Pedagogical tensor math from scalars to Einstein-style structures (NumPy only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luke Jedry" }]
keywords = ["tensors", "differential-geometry", "education", "numpy", "relativity"]
dependencies = [
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "ipykernel>=6.0", "notebook>=7.0"]
dev = ["pytest>=7.0", "jupyter>=1.0", "ipykernel>=6.0", "notebook>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
